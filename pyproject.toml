[project]
name = "pepkio-ph-buffer-solver"
version = "0.1.0"
description = "Python client for Pepkio ph-buffer-solver tool"
readme = "README_PYPI.md"
requires-python = ">=3.11"
authors = [
    { name = "Pepkio Team", email = "tools@pepkio.com" }
]
dependencies = [
    "click>=8.4.2",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]

[project.scripts]
pepkio-ph-buffer-solver = "pepkio_ph_buffer_solver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pepkio_ph_buffer_solver"]

[dependency-groups]
dev = [
    "hatchling>=1.32.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
